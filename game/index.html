<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>无畏契约风格高还原度演示（2D）</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="gameWrap">
      <canvas id="c"></canvas>
      <div id="hud">
        <div id="crosshair"></div>
        <div id="panel">
          <div class="row" style="margin-bottom:8px">
            <div>
              <strong>无畏契约 · 高还原度 2D 练手版</strong><br />
              <span class="muted">WASD 移动、左键射击、右键瞄准、Q闪现、E短暂加速、R 换弹、空格翻滚</span>
            </div>
            <div style="text-align:right; min-width: 130px;">
              <div>击杀 <span id="killCount">0</span></div>
              <div>回合时间 <span id="timeText">0:00</span></div>
            </div>
          </div>

          <div class="row" style="margin-bottom:6px">
            <div style="display:flex; gap:10px; align-items:center; min-width:220px;">
              <span>生命</span>
              <div class="barWrap"><div id="hpBar" class="bar red"></div></div>
            </div>
            <div style="display:flex; gap:10px; align-items:center; min-width:220px;">
              <span>护盾</span>
              <div class="barWrap"><div id="shieldBar" class="bar"></div></div>
            </div>
          </div>

          <div class="row" style="margin-bottom:8px">
            <div style="display:flex; gap:10px; align-items:center;">
              <span>弹匣</span>
              <span id="ammoText">30/120</span>
            </div>
            <div id="ability"></div>
          </div>
        </div>
        <div id="fps">FPS: --</div>
        <div id="tip">提示：这是「高还原度的演示工程」；可继续扩展为真实模型、音效、技能伤害判定与服务器同步版。</div>
        <div id="miniMapWrap"><canvas id="miniMap"></canvas></div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
